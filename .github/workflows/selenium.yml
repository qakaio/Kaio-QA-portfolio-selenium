name: Selenium CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  test:
    name: Selenium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome (stable)
        run: |
          # Use Google's official apt repository for Chrome
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          # Install Chrome stable
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb 2>/dev/null || \
            sudo apt-get install -y -f
          google-chrome-stable --version

      - name: Install ChromeDriver (matching Chrome version)
        run: |
          # Get Chrome version
          CHROME_VERSION=$(google-chrome-stable --version | awk '{print $3}' | cut -d. -f1)
          # Get matching ChromeDriver version from the official repo
          CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION}")
          echo "Chrome version: $CHROME_VERSION"
          echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
          # Download and install ChromeDriver
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -o chromedriver-linux64.zip -d /tmp/chromedriver
          sudo mv /tmp/chromedriver/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 5
          echo "Xvfb running: $!"

      - name: Run Selenium Tests
        run: npm test
        env:
          CI: true
          DISPLAY: :99
          CHROME_BIN: /usr/bin/google-chrome-stable

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Lint
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
          - run: npm ci
          - run: npm run lint

      - name: Generate Allure Report
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
          - name: Download Allure Results
            uses: actions/download-artifact@v4
            with:
              name: allure-results
              path: allure-results/
          - name: Generate Environment Properties
            run: |
              cat > allure-results/environment.properties << 'EOF'
              framework=Selenium WebDriver + Mocha
              language=JavaScript (Node.js)
              browser=Chrome
              os=Ubuntu
              project=Kaio-QA-portfolio-selenium
              repo=https://github.com/qakaio/Kaio-QA-portfolio-selenium
              EOF
          - name: Install Allure
            run: npm install -g allure-commandline
          - name: Generate Allure Report
            run: allure generate allure-results --clean -o allure-report --name "Kaio-QA-portfolio-selenium - Selenium WebDriver + Mocha"
            env:
              ALLURE_RESULTS_DIR: allure-results
          - name: Deploy Allure Report to GitHub Pages
            uses: peaceiris/actions-gh-pages@v3
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: ./allure-report
              destination_dir: allure-report
              keep_files: true
