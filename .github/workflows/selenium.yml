name: Selenium CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  test:
    name: Selenium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome Stable
        uses: actions/setup-chrome@v2
        with:
          chrome-version: 'latest-stable'

      - name: Install ChromeDriver
        uses: captvlad/action-chromedriver@v2
        with:
          version: latest

      - name: Run Selenium Tests
        run: npm test
        env:
          CI: true
          DISPLAY: ':99'
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Lint
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
          - run: npm ci
          - run: npm run lint

      - name: Generate Allure Report
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
          - name: Download Allure Results
            uses: actions/download-artifact@v4
            with:
              name: allure-results
              path: allure-results/
          - name: Generate Environment Properties
            run: |
              cat > allure-results/environment.properties << 'EOF'
              framework=Selenium WebDriver + Mocha
              language=JavaScript (Node.js)
              browser=Chrome
              os=Ubuntu
              project=Kaio-QA-portfolio-selenium
              repo=https://github.com/qakaio/Kaio-QA-portfolio-selenium
              EOF
          - name: Install Allure
            run: npm install -g allure-commandline
          - name: Generate Allure Report
            run: allure generate allure-results --clean -o allure-report --name "Kaio-QA-portfolio-selenium - Selenium WebDriver + Mocha"
            env:
              ALLURE_RESULTS_DIR: allure-results
          - name: Deploy Allure Report to GitHub Pages
            uses: peaceiris/actions-gh-pages@v3
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: ./allure-report
              destination_dir: allure-report
              keep_files: true
